<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                    <i class="bi bi-graph-up-arrow fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1">DataPulse Latam</h4>
                <p class="text-muted small">Inteligencia Económica & Riesgo País</p>
            </div>

        @if (errorMsg()) {
            <div class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMsg() }}
            </div>
        }

            <form (ngSubmit)="onSubmit()">
                <div class="mb-3">
                <label class="form-label fw-semibold small">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                [(ngModel)]="email"
                                placeholder="analista@datapulse.latam"
                                required
                            />
                    </div>
                </div>

                <div class="mb-4">
                <label class="form-label fw-semibold small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            [(ngModel)]="password"
                            placeholder="••••••••"
                            required
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 py-2 fw-semibold"
                    [disabled]="loading()"
                >
                    @if (loading()) {
                        <span class="spinner-border spinner-border-sm me-2"></span> Ingresando...
                    } @else {
                        Iniciar Sesión
                    }
                </button>
            </form>
        </div>
    </div>
</div>
