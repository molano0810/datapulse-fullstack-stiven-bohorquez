@if (authService.isAuthenticated()) {
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/dashboard">
            <i class="bi bi-graph-up-arrow text-info me-2"></i>
            DataPulse <span class="text-info ms-1">Latam</span>
        </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/paises" routerLinkActive="active">
                            <i class="bi bi-globe-americas me-1"></i> Países e Indicadores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/riesgo" routerLinkActive="active">
                            <i class="bi bi-shield-exclamation me-1"></i> Motor IRPC
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/portafolios" routerLinkActive="active">
                            <i class="bi bi-briefcase me-1"></i> Portafolios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/alertas" routerLinkActive="active">
                            <i class="bi bi-bell me-1"></i> Alertas
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div class="text-light small text-end d-none d-md-block">
                        <div class="fw-semibold">{{ authService.currentUser()?.nombre_completo }}</div>
                        <span class="badge bg-info text-dark" style="font-size: 0.7rem;">
                            {{ authService.currentUser()?.rol }}
                        </span>
                    </div>
                    <button class="btn btn-outline-light btn-sm" (click)="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>
}
